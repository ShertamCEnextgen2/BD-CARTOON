<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e8c872; --gold2:#fff1b8; --gold3:#c99a3a;
  --ink:#070b22; --cream:#f6efdc;
  --serif:'Cinzel','Cinzel Decorative',serif;
  --body:'Prompt',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--body);color:var(--cream);
  background:linear-gradient(180deg,#070b22 0%,#101650 28%,#2a2058 58%,#4a2a5e 82%,#9a5a78 100%);
  background-color:#070b22;
  overflow-x:hidden;
}
body.locked{overflow:hidden;height:100vh}


.star{position:absolute;border-radius:50%;background:#fff;opacity:.8;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
[data-speed]{transform:translate3d(0,var(--py,0px),0);will-change:transform}
.rv{opacity:0;transform:translateY(44px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.from-l{transform:translateX(-60px)} .rv.from-r{transform:translateX(60px)}
.rv.from-l.in,.rv.from-r.in{transform:none}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:150;pointer-events:none}


.flash{position:fixed;inset:0;z-index:200;background:#fff;display:none;pointer-events:none;clip-path:circle(0% at 50% 56%)}


.intro{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 75%,#2c3270 0%,#10153a 48%,#04061a 100%);
}
.intro .stars,.loader .stars{position:absolute;inset:0}
.rays{
  position:absolute;left:50%;top:56%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,236,170,.28) 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 40%);mask-image:radial-gradient(circle,#000 0,transparent 40%);
  opacity:0;transition:opacity 1.2s;animation:spin 60s linear infinite;
}
.intro.opening .rays{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.door-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:44px;z-index:2}
.door-wrap{
  position:relative;width:min(58vw,250px);aspect-ratio:250/390;perspective:1000px;cursor:pointer;
  animation:floaty 4.5s ease-in-out infinite;outline:none;-webkit-tap-highlight-color:transparent;
}
.intro.opening .door-wrap{animation:none;cursor:default}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.door-halo{
  position:absolute;inset:-30%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,232,160,.55) 0,rgba(255,232,160,.15) 40%,transparent 68%);
  animation:pulse 3s ease-in-out infinite;transition:transform 1.6s ease;
}
.intro.opening .door-halo{transform:scale(2.6);animation:none;opacity:1}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.door-frame{
  position:absolute;inset:-9px;border:3px solid var(--gold);
  border-radius:50% 50% 4px 4px / 32% 32% 4px 4px;
  box-shadow:0 0 36px rgba(232,200,114,.55),inset 0 0 26px rgba(232,200,114,.45);
}
.door-frame::after{
  content:"";position:absolute;inset:6px;border:1px solid rgba(255,241,184,.55);
  border-radius:50% 50% 2px 2px / 32% 32% 2px 2px;
}
.door-light{
  position:absolute;inset:0;border-radius:50% 50% 0 0 / 32% 32% 0 0;
  background:radial-gradient(ellipse at 50% 62%,#fff 0,#fff6d0 32%,#f2cf7a 70%,#c99a3a 100%);
}
.intro.opening .door-light{animation:lightUp 1.8s ease forwards}
@keyframes lightUp{to{filter:brightness(1.4);box-shadow:0 0 120px 60px rgba(255,248,214,.95)}}
.leaf{
  position:absolute;top:0;bottom:0;width:50%;
  background:linear-gradient(165deg,#f8f2df 0,#d9cba2 100%);
  border:2px solid var(--gold);
  box-shadow:inset 0 0 0 7px #e9dcb5,inset 0 0 0 8px rgba(201,154,58,.8),inset 0 0 22px rgba(120,90,30,.35);
  transition:transform 1.7s cubic-bezier(.6,.05,.2,1);backface-visibility:hidden;
}
.leaf.l{left:0;transform-origin:left center;border-radius:100% 0 0 0 / 32% 0 0 0}
.leaf.r{right:0;transform-origin:right center;border-radius:0 100% 0 0 / 0 32% 0 0}
.leaf::before{content:"";position:absolute;left:14%;right:14%;top:34%;bottom:12%;border:1px solid rgba(201,154,58,.7);border-radius:3px}
.leaf::after{content:"";position:absolute;left:26%;right:26%;top:44%;bottom:22%;border:1px solid rgba(201,154,58,.45)}
.knob{position:absolute;top:56%;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#c99a3a);box-shadow:0 0 8px rgba(255,220,120,.9)}
.leaf.l .knob{right:9px}.leaf.r .knob{left:9px}
.intro.opening .leaf.l{transform:rotateY(-108deg)}
.intro.opening .leaf.r{transform:rotateY(108deg)}
.emblem{
  position:absolute;left:50%;top:30%;width:26%;transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 8px rgba(255,214,110,.95));transition:opacity .5s;animation:spin 14s linear infinite;
}
.intro.opening .emblem{opacity:0}
.hint{
  font-family:var(--serif);letter-spacing:.22em;font-size:clamp(12px,3.4vw,15px);color:var(--gold2);
  text-shadow:0 0 14px rgba(255,220,130,.8);animation:blink 2.2s ease-in-out infinite;text-align:center;
}
.hint small{display:block;margin-top:6px;font-family:var(--body);letter-spacing:.08em;opacity:.75;font-size:.85em}
.intro.opening .hint{opacity:0;transition:opacity .4s;animation:none}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- หน้าโหลด ---------- */
.loader{
  position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#161c52 0,#080b26 55%,#03040f 100%);overflow:hidden;
}
.loader .compass{position:relative;width:min(56vw,230px);aspect-ratio:1;z-index:2}
.compass svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 12px rgba(232,200,114,.7))}
.ring{transform-box:fill-box;transform-origin:center}
.r1{animation:spin 18s linear infinite}.r2{animation:spin 10s linear infinite reverse}
.cstar{transform-box:fill-box;transform-origin:center;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.08);opacity:1}}
.load-text{margin-top:36px;font-family:var(--serif);letter-spacing:.3em;font-size:13px;color:var(--gold2);z-index:2}
.load-tip{margin-top:12px;min-height:2.6em;max-width:80vw;text-align:center;font-weight:300;font-size:14px;line-height:1.6;color:rgba(246,239,220,.8);z-index:2;transition:opacity .4s}
.load-bar{position:absolute;left:6vw;right:6vw;bottom:9vh;z-index:2}
.load-bar .track{height:3px;background:rgba(232,200,114,.2);border-radius:3px;overflow:hidden}
.load-bar .fill{height:100%;width:0;background:linear-gradient(90deg,#c99a3a,#fff1b8);box-shadow:0 0 14px rgba(255,230,150,.9)}
.load-bar .pct{margin-top:8px;text-align:right;font-family:var(--serif);font-size:12px;letter-spacing:.2em;color:var(--gold)}

/* ---------- หน้าหลัก ---------- */
main{display:none;position:relative;z-index:2}
section{position:relative}
.sec-title{text-align:center;margin-bottom:48px}
.sec-title small{display:block;font-family:var(--serif);letter-spacing:.4em;font-size:12px;color:var(--gold);margin-bottom:10px}
.sec-title h2{font-family:var(--serif);font-weight:600;font-size:clamp(26px,6vw,40px);letter-spacing:.08em;
  background:linear-gradient(180deg,#fff,#ffe9a6 60%,#d9a441);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-title .orn{display:block;margin:14px auto 0;width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
.sec-title .orn::after{content:"✦";position:absolute;left:50%;top:-9px;transform:translateX(-50%);color:var(--gold);font-size:14px;background:transparent}

/* Hero */
.hero{height:125vh;overflow:hidden}
.hero .pl{position:absolute}
.hero .pl.center{left:0;right:0;display:flex;justify-content:center}
.hero-stars{position:absolute;inset:0}
.orb{width:min(70vw,460px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#fffbe6 0,#ffe9a6 22%,rgba(255,200,100,.38) 44%,transparent 68%);filter:blur(2px)}
.cloud{width:70vw;height:24vh;border-radius:50%;background:radial-gradient(ellipse,rgba(255,238,205,.24),transparent 70%);filter:blur(12px)}
.gem{display:block;width:var(--s);aspect-ratio:1;transform:rotate(45deg);
  background:linear-gradient(135deg,rgba(255,241,184,.95),rgba(201,154,58,.55));
  box-shadow:0 0 16px rgba(255,220,120,.8);animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(60deg) translateY(-18px)}}
.hero-inner{position:absolute;inset:0 0 auto 0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 5vw}
.compass-bg{position:absolute;width:min(110vw,720px);aspect-ratio:1;opacity:.28;pointer-events:none}
.compass-bg svg{width:100%;height:100%}
.hero .date{font-family:var(--serif);letter-spacing:.4em;font-size:clamp(11px,3vw,14px);color:var(--gold2);margin-bottom:18px;opacity:0;transition:opacity 1.4s 1.6s}
.hero.play .date{opacity:.9}
.hero h1{font-family:'Cinzel Decorative',var(--serif);font-weight:900;line-height:1.05;filter:drop-shadow(0 0 22px rgba(255,205,100,.55))}
.hero h1 .line{display:block;font-size:clamp(44px,14vw,120px);letter-spacing:.03em;white-space:nowrap}
.hero h1 .line.second{font-size:clamp(40px,12.5vw,104px)}
.ch{display:inline-block;opacity:0;background:linear-gradient(180deg,#fff 0,#ffeaa8 50%,#d9a441 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero.play .ch{animation:chIn 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.075s + .25s)}
@keyframes chIn{from{opacity:0;transform:translateY(46px) scale(.8);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.hero .name{margin-top:26px;font-size:clamp(18px,5vw,28px);letter-spacing:.14em;color:var(--cream);text-shadow:0 0 18px rgba(255,220,130,.6);opacity:0;transition:opacity 1.4s 1.9s}
.hero.play .name{opacity:1}
.scroll-hint{position:absolute;left:50%;bottom:-3vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;
  font-family:var(--serif);letter-spacing:.3em;font-size:11px;color:var(--gold2);opacity:0;transition:opacity 1.4s 2.6s}
.hero.play .scroll-hint{opacity:.85}
.scroll-hint i{width:1px;height:46px;background:linear-gradient(var(--gold),transparent);animation:drip 1.8s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* จดหมาย — มินิมอล */
.letter-sec{padding:12vh 6vw 8vh}
.letter{
  max-width:560px;margin:0 auto;
  text-align:center;
}
.letter-date{
  font-family:var(--serif);letter-spacing:.4em;font-size:11px;
  color:var(--gold);opacity:.75;margin-bottom:32px;
}
.letter p{
  font-weight:300;line-height:2.1;font-size:clamp(15px,3.8vw,17px);
  margin-bottom:12px;color:rgba(246,239,220,.88);
}
.letter p:last-child{margin-bottom:0}
.letter .sign{
  margin-top:32px;font-family:var(--serif);color:var(--gold2);
  letter-spacing:.18em;font-size:13px;opacity:.8;
}
.letter-line{
  width:1px;height:48px;margin:0 auto 28px;
  background:linear-gradient(to bottom,transparent,var(--gold),transparent);
}

/* ช่องใส่รูป (placeholder) */
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;height:100%;
  background:repeating-linear-gradient(45deg,rgba(232,200,114,.07) 0 10px,rgba(232,200,114,.13) 10px 20px);
  color:var(--gold2);text-align:center;padding:10px}
.ph svg{width:34px;height:34px;opacity:.85}
.ph span{font-family:var(--serif);letter-spacing:.16em;font-size:12px}
.ph small{font-size:11px;opacity:.7;font-weight:300}

/* แกลเลอรี */
.gallery-sec{padding:12vh 6vw}
.gallery{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:56px 40px}
.pcard:nth-child(even){margin-top:70px}
.frame{background:linear-gradient(160deg,#fff6d8,#c99a3a);padding:8px;border-radius:4px;transform:rotate(var(--r,0deg));
  box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 26px rgba(232,200,114,.3);transition:transform .5s,box-shadow .5s}
.frame.rv{transform:translateY(44px) rotate(var(--r,0deg))}
.frame.rv.in{transform:rotate(var(--r,0deg))}
.frame.rv.in:hover{transform:rotate(0deg) scale(1.03);box-shadow:0 24px 50px rgba(0,0,0,.5),0 0 40px rgba(255,220,130,.55)}
.photo{aspect-ratio:3/4;background:#0c1030;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.cap{padding:12px 4px 4px;text-align:center;color:#3b2a08;font-weight:500;font-size:14px;letter-spacing:.04em}



/* ความสำเร็จ */
.ach-sec{padding:10vh 6vw}
.ach-list{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ach{display:flex;gap:18px;align-items:center;padding:18px 22px;border-radius:6px;
  background:linear-gradient(90deg,rgba(236,229,216,.95),rgba(214,203,178,.92));color:#3b3a4a;
  border-left:6px solid var(--gold3);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ach .ic{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;
  background:radial-gradient(circle at 35% 30%,#fff6c8,#c99a3a);color:#fff;box-shadow:0 0 14px rgba(201,154,58,.8)}
.ach small{display:block;font-family:var(--serif);letter-spacing:.2em;font-size:10px;color:#9a7524}
.ach b{display:block;font-weight:500;font-size:17px;margin:2px 0}
.ach span{font-size:13.5px;font-weight:300;line-height:1.55}

/* ขอพร */
.wish-sec{padding:14vh 6vw;text-align:center}
.wish-btn{position:relative;font-family:var(--serif);font-weight:600;letter-spacing:.3em;font-size:16px;color:#3b2a08;cursor:pointer;
  padding:18px 54px;border:none;border-radius:999px;background:linear-gradient(180deg,#fff6c8,#e8c872 60%,#c99a3a);
  box-shadow:0 0 0 3px rgba(255,241,184,.35),0 0 34px rgba(255,214,110,.7);transition:transform .3s,box-shadow .3s}
.wish-btn:hover{transform:scale(1.06);box-shadow:0 0 0 5px rgba(255,241,184,.4),0 0 54px rgba(255,214,110,.95)}
.wish-note{margin-top:20px;font-weight:300;font-size:13px;opacity:.75}

/* === wish overlay === */
.wish-overlay{
  position:fixed;inset:0;z-index:120;display:none;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 50%,#0a0d2e 0%,#02030d 70%);
}
.wish-overlay.show{display:grid}
.wish-overlay .stars{position:absolute;inset:0}

/* nebula glow สีม่วงน้ำเงิน */
.wish-nebula{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 30%,rgba(100,60,200,.22) 0,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 70%,rgba(60,120,220,.18) 0,transparent 55%),
    radial-gradient(ellipse 50% 60% at 50% 50%,rgba(160,100,255,.12) 0,transparent 70%);
  animation:nebulaDrift 8s ease-in-out infinite alternate;
}
@keyframes nebulaDrift{0%{transform:scale(1)}100%{transform:scale(1.08)}}

/* ดาวตกหลายดวง */
.meteor-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.m-trail{
  position:absolute;border-radius:9999px;
  background:linear-gradient(to bottom right,rgba(255,255,255,.0),rgba(255,255,255,.95),rgba(180,220,255,.0));
  transform-origin:top left;opacity:0;
}
.stage-fall .m-trail:nth-child(1){
  width:3px;height:180px;top:5%;left:72%;transform:rotate(30deg);
  animation:trailFall 1.6s .0s cubic-bezier(.4,0,.9,.6) forwards;
  box-shadow:0 0 18px 5px rgba(190,230,255,.8);
}
.stage-fall .m-trail:nth-child(2){
  width:2px;height:120px;top:12%;left:55%;transform:rotate(28deg);
  animation:trailFall 1.4s .35s cubic-bezier(.4,0,.9,.6) forwards;
  box-shadow:0 0 12px 3px rgba(220,200,255,.7);
}
.stage-fall .m-trail:nth-child(3){
  width:2px;height:90px;top:3%;left:82%;transform:rotate(32deg);
  animation:trailFall 1.2s .6s cubic-bezier(.4,0,.9,.6) forwards;
  box-shadow:0 0 10px 3px rgba(255,220,180,.6);
}
@keyframes trailFall{
  0%{opacity:0;transform-origin:top left}
  10%{opacity:1}
  80%{opacity:.8}
  100%{opacity:0;transform:rotate(30deg) translateY(160vh)}
}

/* burst flash */
.burst{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.stage-burst .burst,.stage-card .burst{animation:burst .9s ease-out forwards}
@keyframes burst{0%{opacity:0}20%{opacity:.85}100%{opacity:0}}

/* wish card */
.wish-card{
  display:none;position:relative;width:min(88vw,400px);
  padding:0;text-align:center;border-radius:16px;overflow:hidden;
}
.stage-card .wish-card{display:block;animation:cardIn .9s cubic-bezier(.2,.9,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:scale(.55) rotate(-6deg)}to{opacity:1;transform:none}}

/* วงแหวนกลมเรืองแสงรอบการ์ด */
.wish-card::before{
  content:"";position:absolute;inset:-3px;border-radius:18px;z-index:0;
  background:conic-gradient(from 0deg,#c99a3a,#fff1b8,#9b6ae0,#5b8fe8,#c99a3a,#fff1b8,#c99a3a);
  animation:borderSpin 4s linear infinite;
}
.wish-card::after{
  content:"";position:absolute;inset:3px;border-radius:14px;z-index:1;
  background:linear-gradient(160deg,#1a1f55 0%,#0d1140 50%,#1e1060 100%);
}
@keyframes borderSpin{to{transform:rotate(360deg)}}

.wish-inner{
  position:relative;z-index:2;padding:44px 32px 36px;
  background:linear-gradient(170deg,rgba(255,255,255,.06) 0,rgba(255,255,255,.01) 100%);
}

/* moon / emblem ด้านบนการ์ด */
.wish-moon{
  width:72px;height:72px;margin:0 auto 18px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff8d0,#e8c872 55%,#b8853a 100%);
  box-shadow:0 0 30px rgba(255,214,110,.7),0 0 60px rgba(255,214,110,.3);
  display:grid;place-items:center;font-size:28px;
  animation:moonPulse 2.5s ease-in-out infinite;
}
@keyframes moonPulse{0%,100%{box-shadow:0 0 30px rgba(255,214,110,.7),0 0 60px rgba(255,214,110,.3)}50%{box-shadow:0 0 40px rgba(255,214,110,.95),0 0 80px rgba(255,214,110,.5)}}

.wish-card .stars5{font-size:22px;letter-spacing:10px;color:var(--gold);text-shadow:0 0 16px rgba(255,214,110,.9)}
.wish-card .stars5 i{font-style:normal;display:inline-block;opacity:0}
.stage-card .stars5 i{animation:starPop .6s ease both;animation-delay:calc(var(--k)*.15s + .6s)}
@keyframes starPop{from{opacity:0;transform:scale(2.6) rotate(-40deg)}to{opacity:1;transform:none}}

.wish-card h4{
  margin:16px 0 4px;font-family:var(--serif);font-weight:600;letter-spacing:.25em;
  font-size:11px;color:rgba(255,241,184,.6);text-transform:uppercase;
}
.wish-divider{
  width:60px;height:1px;margin:10px auto 16px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.wish-card p{
  font-weight:300;line-height:2;font-size:16px;color:var(--cream);
  text-shadow:0 0 20px rgba(200,180,255,.4);
  min-height:3em;
}

/* particle dots รอบการ์ด */
.wish-particles{position:absolute;inset:-60px;pointer-events:none;overflow:visible}
.wish-particles span{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:var(--gold);opacity:0;
}
.stage-card .wish-particles span{animation:particlePop .8s ease both}
.stage-card .wish-particles span:nth-child(1){top:10%;left:5%;animation-delay:.7s}
.stage-card .wish-particles span:nth-child(2){top:30%;left:0%;animation-delay:.85s}

<script>
/* ค่าเริ่มต้น: ถ้าลบหรือไม่ได้ใส่ key ไหนใน CONFIG เว็บจะไม่พัง */
{
  const D={name:"",fromName:"",dateText:"",music:"",avatar:"",banner:"",bannerTitle:"",bannerSub:"",
    photos:[],captions:[],message:[],achievements:[],wishes:["Happy Birthday!"],finaleText:"",loadingTips:["loading..."]};
  for(const k in D) if(CONFIG[k]===undefined) CONFIG[k]=D[k];
}
/* ============ ตัวช่วย ============ */
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);

function makeStars(el, n){
  for(let i=0;i<n;i++){
    const s=document.createElement('i'); s.className='star';
    const z=rand(1,3);
    s.style.cssText=`left:${rand(0,100)}%;top:${rand(0,100)}%;width:${z}px;height:${z}px;animation-delay:${rand(0,3)}s;animation-duration:${rand(2,5)}s`;
    el.appendChild(s);
  }
}
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>';
function photoEl(src,label){
  if(src){const im=document.createElement('img');im.src=src;im.alt=label;return im;}
  const d=document.createElement('div');d.className='ph';
  d.innerHTML=`${CAM}<span>${label}</span><small>ใส่รูปที่นี่</small>`;return d;
}

/* ============ เติมเนื้อหาจาก CONFIG ============ */
document.title = `Happy Birthday ${CONFIG.name} ✦`;

$('heroDate').textContent = CONFIG.dateText;
$('letterTitle').textContent = CONFIG.letterTitle;
CONFIG.message.forEach((t,i)=>{const p=document.createElement('p');p.textContent=t;$('letterBody').appendChild(p);});
const sign=document.createElement('p');sign.className='sign';sign.textContent=`— ${CONFIG.fromName}`;$('letterBody').appendChild(sign);

const speeds=[0.05,-0.04,0.09,-0.06,0.07,-0.03], tilts=[-3,2.5,-2,3,-2.5,2];
CONFIG.photos.forEach((src,i)=>{
  const w=document.createElement('div');w.className='pcard';w.dataset.speed=speeds[i%6];
  const f=document.createElement('div');f.className='frame rv';f.style.setProperty('--r',tilts[i%6]+'deg');
  const ph=document.createElement('div');ph.className='photo';ph.appendChild(photoEl(src,`PHOTO ${i+1}`));
  const cap=document.createElement('div');cap.className='cap';cap.textContent=CONFIG.captions[i]||'';
  f.append(ph,cap);w.appendChild(f);$('gallery').appendChild(w);
});

CONFIG.achievements.forEach((a,i)=>{
  const d=document.createElement('div');d.className='ach rv '+(i%2?'from-r':'from-l');
  d.innerHTML=`<div class="ic">✦</div><div><small>ACHIEVEMENT UNLOCKED</small><b></b><span></span></div>`;
  d.querySelector('b').textContent=a.title;d.querySelector('span').textContent=a.desc;
  $('achList').appendChild(d);
});
$('finaleText').textContent=CONFIG.finaleText;
$('fromName').textContent=`— ${CONFIG.fromName}`;

makeStars($('introStars'),110);makeStars($('loadStars'),90);makeStars($('wishStars'),80);

/* ============ เสียง ============ */
let actx;
function chime(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    [392,523,659,784,1047,1319].forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.13);
      g.gain.linearRampToValueAtTime(.11,t+i*.13+.05);
      g.gain.exponentialRampToValueAtTime(.001,t+i*.13+1.8);
      o.connect(g);g.connect(actx.destination);o.start(t+i*.13);o.stop(t+i*.13+1.9);
    });
  }catch(e){}
}
let bgm=null;
if(CONFIG.music){
  bgm=new Audio(CONFIG.music);bgm.loop=true;bgm.volume=.55;
  $('musicBtn').classList.add('on');
  $('musicBtn').onclick=()=>{ if(bgm.paused){bgm.play();$('musicBtn').style.opacity=1;}else{bgm.pause();$('musicBtn').style.opacity=.5;} };
}

/* ============ แสงวาบขาว ============ */
async function whiteFlash(mid){
  const f=$('flash');f.style.display='block';
  const grow=f.animate([{clipPath:'circle(0% at 50% 56%)'},{clipPath:'circle(150% at 50% 56%)'}],{duration:1000,easing:'cubic-bezier(.6,0,.9,.5)',fill:'forwards'});
  await grow.finished;
  await mid();
  const fade=f.animate([{opacity:1},{opacity:0}],{duration:900,easing:'ease-out',fill:'forwards'});
  await fade.finished;
  f.getAnimations().forEach(a=>a.cancel());f.style.display='none';
}

/* ============ โหลดเพจ ============ */
function runLoader(){
  const urls=[CONFIG.avatar,...CONFIG.photos].filter(Boolean);
  let loaded=false;
  Promise.race([
    Promise.all(urls.map(u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=u;}))),
    wait(12000)
  ]).then(()=>loaded=true);
  let tipI=0;$('loadTip').textContent=CONFIG.loadingTips[0]||'';
  const tipTimer=setInterval(()=>{
    const el=$('loadTip');el.style.opacity=0;
    setTimeout(()=>{tipI=(tipI+1)%CONFIG.loadingTips.length;el.textContent=CONFIG.loadingTips[tipI];el.style.opacity=1;},400);
  },1700);
  const minT=4600,t0=performance.now();
  return new Promise(res=>{
    (function tick(){
      const t=Math.min(1,(performance.now()-t0)/minT);
      let p=1-Math.pow(1-t,2.2);
      if(!loaded) p=Math.min(p,.92);
      const v=Math.round(p*100);
      $('loadFill').style.width=v+'%';$('loadPct').textContent=v+'%';
      if(t>=1&&loaded){clearInterval(tipTimer);res();}else requestAnimationFrame(tick);
    })();
  });
}

/* ============ ลำดับเปิดประตู ============ */
let started=false;
async function openDoor(){
  if(started)return;started=true;
  $('intro').classList.add('opening');
  chime();
  if(bgm)bgm.play().catch(()=>{});
  await wait(1250);
  await whiteFlash(async()=>{
    $('intro').style.display='none';
    $('loader').style.display='flex';
    runLoader().then(async()=>{
      await wait(450);
      await whiteFlash(async()=>{
        $('loader').style.display='none';
        $('main').style.display='block';
        document.body.classList.remove('locked');
        window.scrollTo(0,0);
        onScroll();
      });
    });
  });
}
$('door').addEventListener('click',openDoor);
$('door').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDoor();}});

/* ============ พาราแลกซ์ ============ */
const pEls=[...document.querySelectorAll('[data-speed]')];
let ticking=false;
function onScroll(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(()=>{
    const vh=innerHeight;
    pEls.forEach(el=>{
      const ref=el.parentElement;if(!ref)return;
      const r=ref.getBoundingClientRect();
      if(r.bottom<-400||r.top>vh+400)return;
      const c=r.top+r.height/2-vh/2;
      el.style.setProperty('--py',(c*parseFloat(el.dataset.speed)).toFixed(1)+'px');
    });
    ticking=false;
  });
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',onScroll);

/* เลื่อนแล้วค่อย ๆ โผล่ */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));

/* ============ อนุภาคทองลอย (พื้นหลัง) ============ */
const fx=$('fx'),fc=fx.getContext('2d');let FW,FH;
function sizeFx(){const d=Math.min(devicePixelRatio||1,2);FW=fx.width=innerWidth*d;FH=fx.height=innerHeight*d;fc.setTransform(d,0,0,d,0,0);}
sizeFx();addEventListener('resize',sizeFx);
const motes=Array.from({length:60},()=>({x:rand(0,1),y:rand(0,1),r:rand(.8,2.6),v:rand(.02,.08),a:rand(.3,.9),d:rand(.1,.6),ph:rand(0,6.28)}));
(function drawFx(t){
  fc.clearRect(0,0,innerWidth,innerHeight);
  const sy=scrollY;
  motes.forEach(m=>{
    m.y-=m.v/60;if(m.y<-.05){m.y=1.05;m.x=rand(0,1);}
    const x=(m.x+Math.sin(t/2000+m.ph)*.01)*innerWidth;
    let y=m.y*innerHeight-(sy*m.d*.3)%innerHeight;if(y<0)y+=innerHeight;
    const g=fc.createRadialGradient(x,y,0,x,y,m.r*4);
    g.addColorStop(0,`rgba(255,236,170,${m.a})`);g.addColorStop(1,'rgba(255,236,170,0)');
    fc.fillStyle=g;fc.beginPath();fc.arc(x,y,m.r*4,0,6.283);fc.fill();
  });
  requestAnimationFrame(drawFx);
})(0);

/* ============ ขอพร ============ */
let wishTimers=[];
$('wishBtn').addEventListener('click',()=>{
  const o=$('wishOverlay');
  wishTimers.forEach(clearTimeout);
  $('wishText').textContent=CONFIG.wishes[Math.floor(Math.random()*CONFIG.wishes.length)];
  o.className='wish-overlay show stage-fall';
  wishTimers=[
    setTimeout(()=>{o.className='wish-overlay show stage-burst';},1800),
    setTimeout(()=>{o.className='wish-overlay show stage-card';},2250)
  ];
});
$('wishClose').addEventListener('click',()=>{wishTimers.forEach(clearTimeout);$('wishOverlay').className='wish-overlay';});

/* ============ พลุกระดาษ ============ */
const cf=$('confetti'),cx=cf.getContext('2d');let parts=[],running=false;
function sizeCf(){cf.width=innerWidth;cf.height=innerHeight;}
sizeCf();addEventListener('resize',sizeCf);
const COLORS=['#fff1b8','#e8c872','#ffffff','#ff9fb8','#9fd0ff','#c9a8ff'];
function confettiBurst(n=170){
  for(let i=0;i<n;i++){
    const side=i%2?1:0;
    parts.push({x:side?innerWidth*.9:innerWidth*.1,y:innerHeight*.85,
      vx:(side?-1:1)*rand(3,13),vy:-rand(9,20),g:.28,w:rand(6,11),h:rand(4,8),
      c:COLORS[Math.floor(Math.random()*COLORS.length)],rot:rand(0,6.28),vr:rand(-.3,.3),life:rand(150,260)});
  }
  if(!running){running=true;requestAnimationFrame(loopCf);}
}
function loopCf(){
  cx.clearRect(0,0,cf.width,cf.height);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  parts.forEach(p=>{
    p.vy+=p.g;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/40);
    cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
  });
  if(parts.length)requestAnimationFrame(loopCf);else running=false;
}
$('partyBtn').addEventListener('click',()=>confettiBurst(200));
new IntersectionObserver((es,ob)=>{if(es[0].isIntersecting){setTimeout(()=>confettiBurst(220),500);ob.disconnect();}},{threshold:.5}).observe($('finale'));
</script>
